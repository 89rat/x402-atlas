<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>x402 Atlas — live search for machine-payable APIs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-sans-serif, system-ui; background: #0b0e14; color: #e6e9ef; max-width: 880px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.6rem; } h1 span { color: #4da3ff; }
  .sub { color: #8b93a3; margin-bottom: 1.5rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input[type=text] { flex: 1; padding: .7rem 1rem; border-radius: 8px; border: 1px solid #2a3142; background: #131826; color: inherit; font-size: 1rem; }
  button { padding: .7rem 1.2rem; border-radius: 8px; border: 0; background: #4da3ff; color: #08111f; font-weight: 600; cursor: pointer; }
  .card { border: 1px solid #222a3a; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: .8rem; display: flex; justify-content: space-between; gap: 1rem; }
  .badge { font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; }
  .alive { background: #10331d; color: #51d88a; } .dead { background: #3a1a1a; color: #ff7a7a; }
  .price { white-space: nowrap; color: #51d88a; font-weight: 600; }
  a { color: #4da3ff; text-decoration: none; }
  .muted { color: #8b93a3; font-size: .85rem; }
</style>
</head>
<body>
<h1>x402 <span>Atlas</span></h1>
<p class="sub">Live, verified search for machine-payable (HTTP 402 / x402) APIs. Prices measured by real probes — not seller claims.</p>
<form id="f"><input type="text" id="q" placeholder="e.g. web search, token prices, inference…" autofocus><button>Search</button></form>
<div id="results"><p class="muted">Loading catalog…</p></div>
<script>
async function run(q) {
  const el = document.getElementById('results');
  el.innerHTML = '<p class="muted">Searching…</p>';
  const res = await fetch(`/v1/search?q=${encodeURIComponent(q)}&limit=25`);
  const data = await res.json();
  if (!data.count) { el.innerHTML = '<p class="muted">No results. This query has been logged as demand signal.</p>'; return; }
  el.innerHTML = data.results.map(h => `
    <div class="card">
      <div>
        <strong>${h.title}</strong> <span class="badge ${h.alive ? 'alive' : 'dead'}">${h.alive ? 'alive' : 'unverified'}</span>
        <div class="muted">${h.description || ''} · uptime 7d: ${(h.uptime7d*100).toFixed(0)}%${h.latencyMs ? ` · ${h.latencyMs}ms` : ''}</div>
        <div><a href="${h.baseUrl}${h.endpointPath}" target="_blank" rel="noopener">${h.baseUrl}${h.endpointPath}</a></div>
      </div>
      <div class="price">$${h.priceMin ?? '?'}/call</div>
    </div>`).join('');
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); run(document.getElementById('q').value); };
run('');
</script>
</body>
</html>
